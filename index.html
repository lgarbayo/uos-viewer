<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uos-viewer</title>
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <aside id="panel">
      <!--
        La cabecera y la ficha viven FUERA de `#contenido` a propósito: `#contenido` se
        reemplaza entero al abrir un caso, y con el input de fichero dentro no había forma
        de abrir un segundo `.uos` sin recargar la página.
      -->
      <header id="cabecera">
        <h1>uos-viewer</h1>
        <label class="boton">
          abrir <code>.uos</code>
          <input id="fichero" type="file" accept=".uos" hidden />
        </label>
      </header>
      <div id="ficha"></div>
      <div id="contenido">
        <p>
          Visor de referencia del formato <b>Unified Oral Scene</b>. Arrastra un
          <code>.uos</code> aquí, o ábrelo con el botón de arriba.
        </p>
        <p class="nota">
          Nada sale de tu navegador: el contenedor se lee en local, por rangos, sin subirlo
          a ningún sitio.
        </p>
      </div>
    </aside>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
