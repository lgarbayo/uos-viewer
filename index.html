<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uos-viewer</title>
    <!--
      La display del documento «Unified Oral Scene». Va SOLO en la marca, la portada y el
      boton de abrir: el resto del visor es monoespaciado porque enseña codigos FDI,
      hashes y L*a*b* en columna, y ahi la anchura fija es lo que deja comparar dos filas.
    -->
    <!--
      El tema se decide AQUI, antes de la primera pintura: si lo decidiera React, la
      pagina saldria un fotograma con el tema equivocado. Lo elegido por el usuario manda;
      si no eligio nada, `prefers-color-scheme`. `localStorage` puede lanzar (ventana
      privada, datos bloqueados), y entonces simplemente no hay eleccion guardada.
    -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('uos-viewer:tema'); } catch (e) {}
        if (t !== 'claro' && t !== 'oscuro') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        }
        document.documentElement.dataset.theme = t === 'claro' ? 'light' : 'dark';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    />
  </head>
  <body>
    <!--
      Toda la interfaz la pinta React desde `src/app/ui/`; el lienzo lo crea el `Visor` en
      un efecto (ver `src/app/Visor.ts` para el porqué). Lo que queda aquí es el documento.
    -->
    <div id="raiz"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
